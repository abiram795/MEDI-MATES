<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register | MediMate</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">MediMate</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
        </div>
    </nav>

    <main class="auth-container">
        <div class="auth-box">
            <h2 id="form-title">Login</h2>
            <form id="auth-form">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <div class="input-group register-only" style="display: none;">
                    <label for="role">Role</label>
                    <select id="role">
                        <option value="PATIENT">Patient</option>
                        <option value="HOSPITAL">Hospital</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary" id="submit-btn">Login</button>
            </form>
            <p id="toggle-text">Don't have an account? <a href="#" id="toggle-auth">Register</a></p>
            <div id="error-message" class="error"></div>
        </div>
    </main>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
